name: Build model service image

# Builds the VoxClone model_service (Kokoro + Pocket TTS) container image on
# GitHub's free runners and pushes it to GitHub Container Registry (GHCR).
# Azure Container Apps then pulls this prebuilt image — no ACR Tasks needed,
# which is why this works on an Azure free-trial subscription.

on:
  push:
    branches: [ main ]
    paths:
      - 'model_service/**'
      - '.github/workflows/build-model.yml'
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/voxclone-models" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./model_service
          push: true
          tags: ${{ steps.img.outputs.name }}:latest
